<rect x="30" y="150" width="180" height="90" rx="14" fill="#16201A" stroke="#16201A"/><text x="120" y="193" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Ready to tap</text><text x="120" y="213" font-size="12" font-weight="500" fill="#5B675F" text-anchor="middle">account chosen</text><path d="M210 195 L239.33333333333334 195" stroke="#5B675F" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="243.33333333333334" y="150" width="180" height="90" rx="14" fill="#FFFFFF" stroke="#DCE3DA"/><text x="333.33333333333337" y="193" font-size="15" font-weight="700" fill="#16201A" text-anchor="middle">Tap the reader</text><text x="333.33333333333337" y="213" font-size="12" font-weight="500" fill="#5B675F" text-anchor="middle">NFC, no code shown</text><path d="M423.33333333333337 195 L452.6666666666667 195" stroke="#5B675F" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="456.6666666666667" y="150" width="180" height="90" rx="14" fill="#FFFFFF" stroke="#DCE3DA"/><text x="546.6666666666667" y="193" font-size="15" font-weight="700" fill="#16201A" text-anchor="middle">Result</text><text x="546.6666666666667" y="213" font-size="12" font-weight="500" fill="#5B675F" text-anchor="middle">decided off-device</text><path d="M636.6666666666667 195 L666.0000000000001 195" stroke="#5B675F" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="670" y="150" width="180" height="90" rx="14" fill="#DCFCE7" stroke="#166534"/><text x="760" y="193" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">Receipt</text><text x="760" y="213" font-size="12" font-weight="500" fill="#5B675F" text-anchor="middle">same as QR payments</text>
